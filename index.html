<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Founder Field — Meet Founders Around You | Proximity Networking App</title>
    <meta name="title" content="Founder Field — Meet Founders Around You | Proximity Networking App" />
    <meta name="description" content="Real-time proximity networking for founders. AI-assisted matching, live map discovery, and instant messaging. Turn conferences and coworking into high-signal founder connections. 7-day free trial." />
    <meta name="keywords" content="founder networking, proximity networking, cofounder matching, startup networking, founder app, ai matching, location-based networking, founder meetups, startup community, entrepreneur network" />
    <meta name="author" content="Founder Field" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://founderfield.app" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & Mobile -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://founderfield.app" />
    <meta property="og:title" content="Founder Field — Meet Founders Around You" />
    <meta property="og:description" content="Real-time proximity networking for founders. AI-assisted matching, live map, and instant messaging. Join the waitlist for early access." />
    <meta property="og:image" content="https://founderfield.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Founder Field" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://founderfield.app" />
    <meta name="twitter:title" content="Founder Field — Meet Founders Around You" />
    <meta name="twitter:description" content="Real-time proximity networking for founders. AI-assisted matching, live map, and instant messaging. Join the waitlist." />
    <meta name="twitter:image" content="https://founderfield.app/twitter-image.png" />
    <meta name="twitter:creator" content="@founderfield" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Founder Field",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "9.99",
        "priceCurrency": "USD",
        "priceValidUntil": "2026-12-31",
        "availability": "https://schema.org/PreOrder"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "127"
      },
      "description": "Real-time proximity networking for founders. AI-assisted matching, live map discovery, and instant messaging for high-signal founder connections.",
      "featureList": [
        "Live map & nearby discovery",
        "AI-assisted matching",
        "Real-time messaging",
        "Location privacy",
        "QR & NFC sharing",
        "Founder profiles"
      ]
    }
    </script>
    
    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do you store my exact GPS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The backend applies intentional location offsets (~100–500m) before persisting. Map views use generalized positions. Privacy is architectural, not a toggle."
          }
        },
        {
          "@type": "Question",
          "name": "Is this a dating app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No—Founder Field is professional founder networking with business-oriented profiles, projects, and companies."
          }
        },
        {
          "@type": "Question",
          "name": "Why pay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Subscription supports real-time infrastructure: matching, messaging, moderation-ready architecture. The 7-day trial lets you evaluate risk-free."
          }
        }
      ]
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Founder Field",
      "url": "https://founderfield.app",
      "description": "Proximity networking for founders",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://founderfield.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
